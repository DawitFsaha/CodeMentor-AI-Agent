[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codementor-ai"
version = "0.1.0"
description = "A multi-agent mini coding copilot built with the OpenAI Agents SDK."
requires-python = ">=3.9"
dependencies = [
    "openai-agents==0.8.4",
    "openai==2.19.0",
    "eval-type-backport>=0.2.0; python_version < '3.10'",
    "python-dotenv>=1.0.0",
    "pytest>=8.0",
]

[project.scripts]
codementor = "codementor_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]